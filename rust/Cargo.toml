[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
markdown-rs = "0.1.0"
petgraph = "0.8.3"
pulldown-cmark = "0.13.4"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
